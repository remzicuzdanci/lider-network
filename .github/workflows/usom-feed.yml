name: USOM Threat Feed Update

on:
  schedule:
    - cron: "0 */2 * * *"   # Her 2 saatte bir (GitHub Actions ücretsiz limiti içinde)
  workflow_dispatch:         # Manuel tetikleme

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: USOM verilerini çek ve Supabase'e yaz
        run: |
          set -e

          SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
          SUPABASE_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # USOM API'sini dene (sayfalı)
          echo "USOM API'si deneniyor..."

          TOTAL_PAGES=0
          ALL_DOMAINS=""
          ALL_IPS=""
          ALL_URLS=""

          FIRST=$(curl -sf --max-time 15 \
            -H "User-Agent: Mozilla/5.0 (compatible; LiderNetwork/1.0)" \
            -H "Accept: application/json" \
            "https://www.usom.gov.tr/api/address/index.json?page=1&per-page=2000" 2>/dev/null || echo "")

          if echo "$FIRST" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['meta']['pagination'].get('page-count',d['meta']['pagination'].get('total-pages',0)))" 2>/dev/null; then
            TOTAL_PAGES=$(echo "$FIRST" | python3 -c "import sys,json; d=json.load(sys.stdin); p=d['meta']['pagination']; print(p.get('page-count',p.get('total-pages',0)))" 2>/dev/null || echo 0)
            echo "Toplam sayfa: $TOTAL_PAGES"

            for PAGE in $(seq 1 $TOTAL_PAGES); do
              DATA=$(curl -sf --max-time 12 \
                -H "User-Agent: Mozilla/5.0 (compatible; LiderNetwork/1.0)" \
                "https://www.usom.gov.tr/api/address/index.json?page=$PAGE&per-page=2000" 2>/dev/null || echo "")

              if [ -n "$DATA" ]; then
                DOMAINS_PAGE=$(echo "$DATA" | python3 -c "
import sys, json
try:
    d = json.load(sys.stdin)
    for r in d.get('data', []):
        t = (r.get('type','') or '').lower()
        v = (r.get('url','') or '').strip()
        if v and t == 'domain': print(v)
except: pass
" 2>/dev/null || echo "")

                IPS_PAGE=$(echo "$DATA" | python3 -c "
import sys, json
try:
    d = json.load(sys.stdin)
    for r in d.get('data', []):
        t = (r.get('type','') or '').lower()
        v = (r.get('url','') or '').strip()
        if v and t == 'ip': print(v)
except: pass
" 2>/dev/null || echo "")

                URLS_PAGE=$(echo "$DATA" | python3 -c "
import sys, json
try:
    d = json.load(sys.stdin)
    for r in d.get('data', []):
        t = (r.get('type','') or '').lower()
        v = (r.get('url','') or '').strip()
        if v and t == 'url': print(v)
except: pass
" 2>/dev/null || echo "")

                ALL_DOMAINS="$ALL_DOMAINS
$DOMAINS_PAGE"
                ALL_IPS="$ALL_IPS
$IPS_PAGE"
                ALL_URLS="$ALL_URLS
$URLS_PAGE"
              fi

              sleep 0.3  # Rate limit önlemi
            done

            echo "USOM API başarılı!"
          else
            echo "USOM API erişilemiyor, fallback kaynaklar kullanılıyor..."

            ALL_DOMAINS=$(curl -sf --max-time 30 \
              "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts" | \
              grep "^0\.0\.0\.0 " | awk '{print $2}' | \
              grep -v "^0\.0\.0\.0$\|^localhost" || echo "")

            ALL_IPS=$(curl -sf --max-time 20 \
              "https://raw.githubusercontent.com/stamparm/ipsum/master/levels/3.txt" | \
              grep -v "^#" | awk '{print $1}' || echo "")
          fi

          # Temizle + deduplicate
          DOMAINS=$(echo "$ALL_DOMAINS" | grep -v "^#\|^;" | grep "\." | sort -u | head -500000)
          IPS_V4=$(echo "$ALL_IPS" | grep -E "^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+" | sort -u | head -100000)
          IPS_V6=$(echo "$ALL_IPS" | grep ":" | sort -u)
          URLS=$(echo "$ALL_URLS" | grep "^http" | sort -u)

          echo "Domain: $(echo "$DOMAINS" | wc -l)"
          echo "IPv4:   $(echo "$IPS_V4" | wc -l)"
          echo "IPv6:   $(echo "$IPS_V6" | wc -l)"
          echo "URL:    $(echo "$URLS" | wc -l)"

          # Supabase'e JSON olarak yaz
          upsert_feed() {
            local TYPE="$1"
            local CONTENT="$2"
            local COUNT=$(echo "$CONTENT" | grep -c . || echo 0)
            local SIZE=${#CONTENT}

            PAYLOAD=$(python3 -c "
import json, sys
content = sys.stdin.read()
count = len([l for l in content.split('\n') if l.strip()])
payload = [{
  'feed_type': '$TYPE',
  'content': content,
  'record_count': count,
  'size_bytes': len(content.encode()),
  'updated_at': '$NOW',
  'pages_fetched': 1,
  'total_pages': 1,
  'partial': False
}]
print(json.dumps(payload))
" <<< "$CONTENT")

            curl -sf -X POST \
              "${SUPABASE_URL}/rest/v1/threat_feeds" \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              -H "Content-Type: application/json" \
              -H "Prefer: resolution=merge-duplicates,return=minimal" \
              -d "$PAYLOAD" > /dev/null && echo "$TYPE feed yazıldı" || echo "$TYPE feed yazma hatası"
          }

          upsert_feed "domain" "$DOMAINS"
          upsert_feed "ipv4"   "$IPS_V4"
          upsert_feed "ipv6"   "$IPS_V6"
          upsert_feed "url"    "$URLS"

          echo "Güncelleme tamamlandı: $NOW"
