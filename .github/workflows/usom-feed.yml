name: USOM Threat Feed Update

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Threat feed güncelle
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Vercel cron tetikleniyor..."

          RESPONSE=$(curl -sf \
            "https://threat.lidernetwork.com.tr/api/cron/usom" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 90 || echo '{"success":false,"error":"curl failed"}')

          echo "Response: $RESPONSE"

          SUCCESS=$(echo "$RESPONSE" | jq -r '.success // false')
          DOMAIN=$(echo "$RESPONSE"  | jq -r '.fetched.domain // 0')
          IPV4=$(echo "$RESPONSE"    | jq -r '.fetched.ipv4 // 0')
          ELAPSED=$(echo "$RESPONSE" | jq -r '.elapsed_ms // 0')

          echo "success:  $SUCCESS"
          echo "domain:   $DOMAIN"
          echo "ipv4:     $IPV4"
          echo "elapsed:  ${ELAPSED}ms"

          if [ "$SUCCESS" != "true" ]; then
            echo "HATA: Feed güncellenemedi"
            exit 1
          fi
