<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380">
  <defs>
    <linearGradient id="lid" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9edf2"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f9"/><stop offset="1" stop-color="#e2e7ed"/>
    </linearGradient>
  </defs>
  <rect width="680" height="380" fill="#ffffff"/>
  <!-- gölge -->
  <ellipse cx="360" cy="300" rx="240" ry="22" fill="#0f172a" opacity="0.07"/>

  <!-- sağ yan yüz (gölgeli) -->
  <polygon points="480,188 630,102 630,164 480,250" fill="#cdd4dd"/>
  <!-- üst kapak -->
  <polygon points="120,188 480,188 630,102 270,102" fill="url(#lid)" stroke="#d3dae2" stroke-width="1"/>
  <!-- ön yüz (I/O paneli) -->
  <polygon points="120,188 480,188 480,250 120,250" fill="url(#front)" stroke="#d3dae2" stroke-width="1"/>

  <!-- KAPAKTA FORTINET LOGOSU (eğimli düzleme yatırılmış) -->
  <g transform="translate(232,150) skewX(-30) scale(1.06,0.6)">
    <text x="0" y="0" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="58" letter-spacing="3" fill="#c4cad3">F</text>
    <!-- kırmızı sinyal-bar 'O' -->
    <g fill="#ee2e3a">
      <polygon points="44,-6 52,-6 46,0 38,0"/>
      <polygon points="46,-16 56,-16 50,0 40,0"/>
      <polygon points="48,-27 60,-27 54,0 42,0"/>
      <polygon points="50,-39 64,-39 58,0 44,0"/>
    </g>
    <text x="70" y="0" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="58" letter-spacing="3" fill="#c4cad3">RTINET</text>
  </g>

  <!-- ÖN PANEL: küçük Fortinet logosu -->
  <g transform="translate(134,205)">
    <g fill="#ee2e3a"><polygon points="6,8 11,0 16,0 11,8"/><polygon points="12,8 17,0 22,0 17,8"/></g>
    <text x="26" y="8" font-family="Arial, sans-serif" font-size="9" font-weight="800" fill="#11243f">FORTINET</text>
    <text x="0" y="22" font-family="Arial, sans-serif" font-size="8.5" font-weight="700" fill="#5b6675">FortiGate</text>
  </g>

  <!-- console / usb -->
  <rect x="208" y="214" width="18" height="9" rx="1.5" fill="#2a3038"/>
  <rect x="208" y="226" width="18" height="9" rx="2" fill="#1c5fd6"/>
  <!-- SFP kafesler -->
  <g fill="#2a3038"><rect x="236" y="210" width="22" height="12" rx="1.5"/><rect x="236" y="226" width="22" height="12" rx="1.5"/></g>
  <g fill="#2a3038"><rect x="264" y="210" width="22" height="12" rx="1.5"/><rect x="264" y="226" width="22" height="12" rx="1.5"/></g>

  <!-- RJ45 port bloğu (2 sıra x 4) -->
  <g fill="#1d2229" stroke="#0c0f13" stroke-width="0.8">
    <rect x="312" y="208" width="24" height="15" rx="2"/><rect x="340" y="208" width="24" height="15" rx="2"/>
    <rect x="368" y="208" width="24" height="15" rx="2"/><rect x="396" y="208" width="24" height="15" rx="2"/>
    <rect x="312" y="228" width="24" height="15" rx="2"/><rect x="340" y="228" width="24" height="15" rx="2"/>
    <rect x="368" y="228" width="24" height="15" rx="2"/><rect x="396" y="228" width="24" height="15" rx="2"/>
  </g>
  <!-- LED'ler -->
  <g><circle cx="436" cy="214" r="3" fill="#27c24c"/><circle cx="436" cy="226" r="3" fill="#27c24c"/><circle cx="448" cy="214" r="3" fill="#f5b40a"/></g>
  <!-- model yuvası (vida) -->
  <circle cx="462" cy="232" r="6" fill="#e6eaf0" stroke="#cbd2db"/>
</svg>
