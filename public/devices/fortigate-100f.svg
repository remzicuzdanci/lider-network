<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 210" width="470" height="210">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#eef1f5"/><stop offset="1" stop-color="#dde3ea"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f8fa"/><stop offset="1" stop-color="#e7ecf1"/>
    </linearGradient>
  </defs>
  <rect width="470" height="210" fill="#ffffff"/>
  <ellipse cx="235" cy="170" rx="180" ry="13" fill="#0f172a" opacity="0.06"/>
  <!-- rack ears -->
  <rect x="36" y="74" width="14" height="64" rx="3" fill="#d4dae2"/>
  <rect x="420" y="74" width="14" height="64" rx="3" fill="#d4dae2"/>
  <circle cx="43" cy="84" r="2.6" fill="#aab3bf"/><circle cx="43" cy="128" r="2.6" fill="#aab3bf"/>
  <circle cx="427" cy="84" r="2.6" fill="#aab3bf"/><circle cx="427" cy="128" r="2.6" fill="#aab3bf"/>
  <!-- chassis 1U -->
  <rect x="50" y="72" width="370" height="70" rx="7" fill="url(#body)" stroke="#cfd6df" stroke-width="1"/>
  <rect x="50" y="72" width="370" height="12" rx="7" fill="#ffffff" opacity="0.6"/>
  <!-- front face -->
  <rect x="60" y="88" width="350" height="44" rx="5" fill="url(#face)" stroke="#d7dde4"/>
  <!-- Fortinet logo -->
  <g transform="translate(72,98)">
    <path d="M0 12 L9 0 L16 0 L7 12 Z" fill="#ee2e3a"/>
    <path d="M10 12 L19 0 L26 0 L17 12 Z" fill="#ee2e3a"/>
    <text x="32" y="11" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#11243f">Fortinet</text>
  </g>
  <!-- LEDs -->
  <g><circle cx="176" cy="98" r="2.6" fill="#27c24c"/><circle cx="186" cy="98" r="2.6" fill="#27c24c"/><circle cx="196" cy="98" r="2.6" fill="#f5b40a"/></g>
  <!-- ports -->
  <g fill="#222831" stroke="#10141a" stroke-width="0.8">
    <rect x="214" y="104" width="18" height="16" rx="2"/><rect x="236" y="104" width="18" height="16" rx="2"/>
    <rect x="258" y="104" width="18" height="16" rx="2"/><rect x="280" y="104" width="18" height="16" rx="2"/>
    <rect x="302" y="104" width="18" height="16" rx="2"/><rect x="324" y="104" width="18" height="16" rx="2"/>
  </g>
  <g fill="#2f3640"><rect x="352" y="104" width="22" height="16" rx="2"/><rect x="378" y="104" width="22" height="16" rx="2"/></g>
  <!-- model label -->
  <text x="235" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#0f172a">FortiGate 100F</text>
</svg>
